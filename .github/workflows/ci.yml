name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 26
  # Keep pnpm's postinstall approvals and release-age policy exactly as in pnpm-workspace.yaml.
  CI: true

jobs:
  quality:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Conventional commits (PR)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm knip
      - run: pnpm i18n:check
      - run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          node -e '
            const s = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${s[k].pct}% |`;
            console.log(["| Metric | Coverage |", "|---|---|", row("lines"), row("statements"), row("functions"), row("branches")].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm storybook:build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: docker/setup-buildx-action@v3
      # Build the same prod image the e2e compose profile references, into the local daemon,
      # so `docker compose up` below reuses it instead of rebuilding without the layer cache.
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          load: true
          tags: web-app-template:local
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start the e2e stack
        run: docker compose --profile e2e up -d --wait --wait-timeout 180
      - run: pnpm exec playwright install --with-deps chromium
      # E2E_SKIP_STACK stops e2e/global-setup.ts starting the stack a second time: it would run
      # `stack:e2e`, which passes --build and would rebuild without the buildx cache used above.
      - run: pnpm test:e2e
        env:
          E2E_SKIP_STACK: "1"
      - name: Container logs
        if: failure()
        run: docker compose --profile e2e logs --no-color --tail=400
      - name: Stop the e2e stack
        if: always()
        run: docker compose --profile e2e down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
